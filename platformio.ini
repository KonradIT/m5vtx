[platformio]
default_envs = m5stack-basic-v27

[env:m5stack-basic-v27]
platform = espressif32@6.12.0
board = m5stack-core-esp32
framework = arduino
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
; PlatformIO finds the board's port by itself; pin it here or with --upload-port.
upload_speed = 460800
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DCORE_DEBUG_LEVEL=1
extra_scripts = pre:tools/vtx_dependency.py
lib_deps =
    m5stack/M5Unified@0.2.28
    m5stack/M5GFX@0.2.35
    https://github.com/igorka48/VTXControl_ESP32.git#54c21169305499667b9039022282288177ef1699


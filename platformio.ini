[platformio]
default_envs = m5stack-basic-v27

[env:m5stack-basic-v27]
platform = espressif32@6.12.0
board = m5stack-core-esp32
framework = arduino
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
upload_port = COM24
monitor_port = COM24
upload_speed = 460800
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@0.2.28
    m5stack/M5GFX@0.2.35


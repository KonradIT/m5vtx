[platformio]
default_envs = m5stack-basic-v27

; Shared by every board. Each environment adds its M5VTX_BOARD, features and
; wiring; include/board.h lists the defines and checks them.
[env]
platform = espressif32@6.12.0
framework = arduino
board_build.f_cpu = 240000000L
; PlatformIO finds the board's port by itself; pin it here or with --upload-port.
upload_speed = 460800
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts = pre:tools/vtx_dependency.py
lib_deps =
    m5stack/M5Unified@0.2.28
    m5stack/M5GFX@0.2.35
    https://github.com/igorka48/VTXControl_ESP32.git#54c21169305499667b9039022282288177ef1699

[env:m5stack-basic-v27]
board = m5stack-core-esp32
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
; Video on DAC2: DAC1, GPIO25, is the speaker. Control wire on the M-Bus pins.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DM5VTX_BOARD=M5VTX_BOARD_BASIC
    -DM5VTX_HAS_SD=1
    -DM5VTX_VIDEO_DAC_GPIO=26
    -DM5VTX_CONTROL_PINS=16,17
    -DM5VTX_CONTROL_PIN_DEFAULT=16

[env:m5stickc-plus2]
; ESP32-PICO-V3-02, 8 MB flash. No PlatformIO board of its own; the StickC's
; serves with the flash size raised.
board = m5stick-c
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions_8mb.csv
; No card slot, so no SD movies. Video and control wire on the HAT header, G26
; and G0, next to 5V and GND; G32 and G33 on the Grove port are the other choices
; for the control wire. GPIO16 and GPIO17 are the PSRAM's.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DM5VTX_BOARD=M5VTX_BOARD_STICKC_PLUS2
    -DM5VTX_HAS_SD=0
    -DM5VTX_VIDEO_DAC_GPIO=26
    -DM5VTX_CONTROL_PINS=0,32,33
    -DM5VTX_CONTROL_PIN_DEFAULT=0
build_src_filter = +<*> -<sd_video_player.cpp>
